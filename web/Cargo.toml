[package]
name = "sudoku-web"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Jozefpodlecki/Sudoku"
description = "A Sudoku engine and web client written in Rust with Yew and WebAssembly."
categories = ["games", "wasm", "web-programming"]
keywords = ["sudoku", "yew", "wasm", "game"]
rust-version = "1.100.0"
license-file = "../LICENSE"

[dependencies]
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20.0"
wasm-bindgen = "0.2.114"
wasm-bindgen-futures = "0.4.64"
js-sys = "0.3.91"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
rmp-serde = "1.3.1"
rmp = "0.8.15"
console_error_panic_hook = "0.1.7"
futures = "0.3.32"
log = "0.4.29"
wasm-logger = "0.2.0"
gloo = "0.12"
gloo-timers = "0.4.0"
yew_icons = {version = "0.10", features = ["lucide", "simple_icons"]}
rand = "0.10.3"
getrandom = { version = "0.4.2", features = ["wasm_js"] }
chrono = { version = "0.4.44", features = ["serde"] }
thiserror = "2.0.20"
sudoku-core = { path = "../crates/sudoku-core" }
serde-big-array = "0.5.1"
wasmalloc = { version = "0.1.1" }

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Document",
    "Navigator",
    "Clipboard",
    "ClipboardEvent",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "BeforeUnloadEvent",
    "CssStyleDeclaration",
    "MouseEvent",
    "DomRect",
    "DomTokenList",
    "DomStringMap",
    "DragEvent",
    "DataTransfer",
    "File",
    "FileList",
    "FileReader",
    "Performance",
]